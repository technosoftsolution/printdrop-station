name: PrintDrop Windows Release & Auto-Updater

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Run UI/API Contract & Regression Gate
        run: npm run test:regression

      - name: Prepare Windows Binary Resources (cloudflared & SumatraPDF settings)
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/bin" | Out-Null
          if (-not (Test-Path "src-tauri/bin/cloudflared.exe")) {
            Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "src-tauri/bin/cloudflared.exe"
          }
          if (-not (Test-Path "src-tauri/bin/SumatraPDF-settings.txt") -and (Test-Path "bin/SumatraPDF-settings.txt")) {
            Copy-Item "bin/SumatraPDF-settings.txt" "src-tauri/bin/SumatraPDF-settings.txt"
          }

      - name: Run Cargo tests (Clean Retail Edition)
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features

      - name: Run Cargo tests (Virtual Demo Edition)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build & Publish Clean Retail Edition + Updater Manifest (latest.json)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PrintDrop ${{ github.ref_name }}'
          releaseBody: 'Automated signed Windows 11 release for PrintDrop Retail & Virtual Demo stations.'
          releaseDraft: false
          prerelease: false
          args: --ignore-version-mismatches -- --no-default-features

      - name: Build Virtual Demo Edition Installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $confPath = "src-tauri/tauri.conf.json"
          $conf = Get-Content $confPath -Raw | ConvertFrom-Json
          $conf.plugins.updater.endpoints = @("https://nslcrlvuulgqtrdqrkgv.supabase.co/functions/v1/ota-update?edition=virtual")
          $conf | ConvertTo-Json -Depth 10 | Set-Content $confPath -Encoding UTF8

          npx tauri build -f simulation --ignore-version-mismatches
          mkdir -Force dist-ci
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          $sigFile = "$($exe.FullName).sig"
          Copy-Item $exe.FullName "dist-ci/PrintDrop_Demo_Station_Virtual_x64-setup.exe"

          $sigContent = (Get-Content $sigFile -Raw).Trim()
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $version = $conf.version
          $manifest = @{
            version = $version
            notes = "PrintDrop Virtual Demo Edition $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url = "https://github.com/$repo/releases/download/$tag/PrintDrop_Demo_Station_Virtual_x64-setup.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "dist-ci/virtual-latest.json" -Encoding UTF8

      - name: Attach Virtual Demo Installer & OTA Manifest to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist-ci/PrintDrop_Demo_Station_Virtual_x64-setup.exe
            dist-ci/virtual-latest.json
